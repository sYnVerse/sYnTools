<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f1f5f9" />
    <style>
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
      html, body { background-color: #f1f5f9; }
      html.dark, html.dark body { background-color: #0B1021; }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('vueuse-color-scheme') || 'auto';
          var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          // Splash colors from christran.io brand tokens (set before splash paints).
          if (dark) {
            root.classList.add('dark');
            root.style.setProperty('--vpss-bg-splash', '#0B1021');
            root.style.setProperty('--vpss-bg-loader', '#7B9EFF');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1021');
          } else {
            root.style.setProperty('--vpss-bg-splash', '#f1f5f9');
            root.style.setProperty('--vpss-bg-loader', '#4B6EDF');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#7B9EFF');
          }
        }
        catch (e) {}
      })();
    </script>
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
